services:
  postgres:
    image: postgres:16-alpine
    container_name: localstack-demo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: localstack_demo
      POSTGRES_USER: localstack
      POSTGRES_PASSWORD: localstack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localstack -d localstack_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4.5.0
    container_name: localstack-demo
    ports:
      - "4566:4566"
    environment:
      SERVICES: cloudformation,s3,ssm,sqs,sns,lambda
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: 1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack:/opt/demo"
      - "./localstack/init:/etc/localstack/init"

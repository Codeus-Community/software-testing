spring:
  application:
    name: localstack-demo
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  demo:
    # Shared template values. Provide them via a profile file or environment variables.
    region: ${APP_DEMO_REGION}
    aws:
      access-key: ${APP_DEMO_AWS_ACCESS_KEY}
      secret-key: ${APP_DEMO_AWS_SECRET_KEY}
    s3:
      bucket: ${APP_DEMO_S3_BUCKET}
      key: ${APP_DEMO_S3_KEY}
    sqs:
      queue-name: ${APP_DEMO_SQS_QUEUE_NAME}
    sns:
      topic-name: ${APP_DEMO_SNS_TOPIC_NAME}
      subscription-queue-name: ${APP_DEMO_SNS_SUBSCRIPTION_QUEUE_NAME}
    lambda:
      function-name: ${APP_DEMO_LAMBDA_FUNCTION_NAME}
    ssm:
      batch-size-parameter: ${APP_DEMO_LAMBDA_BATCH_SIZE_PARAM}
      use-lambda-parameter: ${APP_DEMO_LAMBDA_USE_LAMBDA_PARAM}
    defaults:
      batch-size: ${APP_DEMO_DEFAULT_BATCH_SIZE}
      use-lambda: ${APP_DEMO_DEFAULT_USE_LAMBDA}
    consumer:
      enabled: ${APP_DEMO_CONSUMER_ENABLED}
      poll-delay-ms: ${APP_DEMO_CONSUMER_POLL_DELAY_MS}
      max-messages: ${APP_DEMO_CONSUMER_MAX_MESSAGES}
